name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, Lint & REUSE (C++20 / CMake 3.24+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for REUSE and manifest scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake and REUSE tool
        run: pip install "cmake>=3.24" reuse

      - name: Run full check suite
        run: make check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
